<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      The Content-Security-Policy meta tag is injected at BUILD time by the
      `plektos-csp-meta` plugin in vite.config.ts, not written here: in dev,
      Vite injects an inline React Refresh script that `script-src 'self'`
      would block.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />

    <!-- Primary Meta Tags -->
    <title>Plektos - Decentralized Meetup Events</title>
    <meta name="title" content="Plektos - Decentralized Meetup Events" />
    <meta
      name="description"
      content="Plektos is a decentralized meetup platform, built on Nostr. Create, join, and manage events with privacy and freedom."
    />
    <meta
      name="keywords"
      content="meetup, events, nostr, decentralized, privacy, social, community"
    />
    <meta name="author" content="Plektos" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    <meta name="generator" content="Plektos" />

    <!-- Favicon -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <meta name="theme-color" content="#0b0b12" />

    <!--
      Theme before first paint. External, not inline: the production CSP is
      `script-src 'self'`, which blocks inline script outright — as an inline
      block this never ran. See public/theme-init.js.
    -->
    <script src="/theme-init.js"></script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://plektos.app" />
    <meta property="og:title" content="Plektos - Decentralized Meetup Events" />
    <meta
      property="og:description"
      content="Plektos is a decentralized meetup platform, built on Nostr. Create, join, and manage events with privacy and freedom."
    />
    <meta property="og:image" content="/plektos.png" />
    <meta property="og:site_name" content="Plektos" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://plektos.app" />
    <meta
      name="twitter:title"
      content="Plektos - Decentralized Meetup Events"
    />
    <meta
      name="twitter:description"
      content="Plektos is a decentralized meetup platform, built on Nostr. Create, join, and manage events with privacy and freedom."
    />
    <meta name="twitter:image" content="/plektos.png" />
    <meta name="twitter:creator" content="@plektos" />

    <!-- Additional Meta Tags -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Plektos" />
    <meta name="application-name" content="Plektos" />
    <meta name="msapplication-TileColor" content="#0b0b12" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- Disable Google Translate -->
    <meta name="google" content="notranslate" />

    <!-- Cache Control - Prevent caching of this HTML file -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://plektos.app" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
